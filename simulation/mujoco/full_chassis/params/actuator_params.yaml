note: Motor gear=1 represents the external joint mapping. The joint motor's internal 10:1 reducer is already reflected in its output-side datasheet torque and speed. Manufacturer performance plots do not provide a complete torque-speed envelope, so the MJCF remains a saturated ideal torque source rather than inventing a speed-dependent curve.
