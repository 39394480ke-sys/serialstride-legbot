schema_version: 2
units:
  hinge: rad
  slide: m

active_joint_types:
  joint_a:
    model_joints: [left_joint_a, right_joint_a]
    calibration_mechanical_range: [-0.346, 0.346]
    calibration_software_range: [-0.277, 0.277]
    coordinate: extension_positive
    source: firmware mechanical-contact capture, 100 samples per endpoint
    confidence: MEASURED
  joint_b:
    model_joints: [left_joint_b, right_joint_b]
    calibration_mechanical_range: [-0.356, 0.355]
    calibration_software_range: [-0.285, 0.284]
    coordinate: extension_positive
    source: firmware mechanical-contact capture, 100 samples per endpoint
    confidence: MEASURED

modal_coordinates:
  convention: extension_positive_active_joint_coordinates
  inverse_mapping:
    q_a: shape + rotation
    q_b: shape - rotation
  shape:
    expression: (q_a + q_b) / 2
    joint_coefficients: {joint_a: 0.5, joint_b: 0.5}
    mechanical_range: [-0.351, 0.3505]
    software_range: [-0.281, 0.2805]
    range_source: paired joint_a/joint_b calibration endpoints
    tendons:
      left: {name: left_leg_shape, joints: [left_joint_a, left_joint_b]}
      right: {name: right_leg_shape, joints: [right_joint_a, right_joint_b]}
  rotation:
    expression: (q_a - q_b) / 2
    joint_coefficients: {joint_a: 0.5, joint_b: -0.5}
    observation_range: [-3.141592653589793, 3.141592653589793]
    physical_range_status: USER_VERIFIED_CONTINUOUS_360
    tendons:
      left: {name: left_leg_rotation, joints: [left_joint_a, left_joint_b]}
      right: {name: right_leg_rotation, joints: [right_joint_a, right_joint_b]}
  viewer_keyframes:
    ROTATION_N180: -3.141592653589793
    ROTATION_N090: -1.5707963267948966
    ROTATION_P090: 1.5707963267948966
    ROTATION_P180: 3.141592653589793

gas_spring_slides:
  left:
    joint: link_012_joint
    normalization_pose: EXTEND
    range: [-0.0231, 0.0]
  right:
    joint: link_023_joint
    normalization_pose: EXTEND
    range: [-0.0231, 0.0]
  coordinate: q=0 at maximum extension; q<0 when compressed
  model_derived_pose_span_m: 0.023008515
  physical_stroke_m: 0.023
  physical_stroke_source: user estimate
  confidence: USER_ESTIMATED
  status: PROVISIONAL
  note: Re-measure after the second mechanical revision is assembled.

